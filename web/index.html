<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数字档案长期保存</title>
<style>body{font:16px system-ui;max-width:980px;margin:32px auto;padding:0 16px}input,textarea,button,select{font:inherit;padding:8px;margin:4px}textarea{width:100%;height:110px}.panel{border:1px solid #bbb;padding:16px;border-radius:8px;margin:12px 0}pre{background:#f4f4f4;padding:12px;white-space:pre-wrap}table td:first-child{color:#444}</style></head>
<body><h1>数字档案长期保存</h1><p>演示账号：owner、archivist、auditor、outsider。请求使用 <code>X-User-Id</code>。</p>
<section class="panel"><select id="user"><option>owner</option><option>archivist</option><option>auditor</option><option>outsider</option></select>
<button onclick="loadStatus()">查看档案状态</button><pre id="out"></pre></section>
<section class="panel"><h2>存储整理</h2>
<p>相同摘要的内容实体在版本与副本间共用。这里可以看到物理/逻辑占用、无引用的残留实体和可回收空间；确认后清空残留，被引用的实体不会删除。</p>
<button id="btnStorageView">查看存储占用与残留</button>
<button id="btnStoragePurge">确认清空残留实体</button>
<div id="storageOut"></div></section>
<p>详细接口见 README。页面用于完成初始化后的状态检查，核心流程由 JSON API 提供。</p>
<script>const out=document.querySelector("#out"),user=document.querySelector("#user");async function loadStatus(){const id=prompt("档案 ID","1");const r=await fetch(`/api/archives/${id}/status`,{headers:{"X-User-Id":user.value}});out.textContent=JSON.stringify(await r.json(),null,2)}</script>
<script src="/static/storage.js"></script></body></html>

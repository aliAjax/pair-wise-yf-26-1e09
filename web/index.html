<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数字档案长期保存</title>
<style>body{font:16px system-ui;max-width:980px;margin:32px auto;padding:0 16px}input,textarea,button,select{font:inherit;padding:8px;margin:4px}textarea{width:100%;height:110px}.panel{border:1px solid #bbb;padding:16px;border-radius:8px;margin:12px 0}pre{background:#f4f4f4;padding:12px;white-space:pre-wrap}.muted{color:#666;font-size:13px}</style></head>
<body><h1>数字档案长期保存</h1><p>演示账号：owner、archivist、auditor、outsider。请求使用 <code>X-User-Id</code>。</p>
<section class="panel"><select id="user"><option>owner</option><option>archivist</option><option>auditor</option><option>outsider</option></select>
<button onclick="loadStatus()">查看档案状态</button><pre id="out"></pre></section>

<section class="panel"><h2>存储整理</h2>
<p class="muted">版本、副本、迁移产生的相同摘要内容共用一份实体。这里可盘点占用、生成残留实体清理计划，确认后才会删除。</p>
<button onclick="loadStorage()">存储盘点</button>
<button onclick="planCleanup()">生成清理计划</button>
<button onclick="loadTasks()">查看整理任务</button>
<div id="cleanupBox"></div>
<pre id="storageOut"></pre></section>

<p>详细接口见 README。页面用于完成初始化后的状态检查，核心流程由 JSON API 提供。</p>
<script>
const out=document.querySelector("#out"),user=document.querySelector("#user");
const storageOut=document.querySelector("#storageOut"),cleanupBox=document.querySelector("#cleanupBox");
function fmt(n){return (n/1024).toFixed(1)+" KiB"}
async function api(path,opts){const r=await fetch(path,Object.assign({headers:{"X-User-Id":user.value,"Content-Type":"application/json"}},opts));return {status:r.status,data:await r.json()}}
async function loadStatus(){const id=prompt("档案 ID","1");const {data}=await api(`/api/archives/${id}/status`);out.textContent=JSON.stringify(data,null,2)}
async function loadStorage(){const {data}=await api("/api/storage");storageOut.textContent=JSON.stringify(data,null,2)}
async function planCleanup(){const {data}=await api("/api/storage/cleanups",{method:"POST"});storageOut.textContent=JSON.stringify(data,null,2);if(data.id)renderTask(data)}
async function loadTasks(){const {data}=await api("/api/storage/cleanups");storageOut.textContent=JSON.stringify(data,null,2);cleanupBox.innerHTML=(data.tasks||[]).map(t=>`<div>任务 #${t.id}：${t.state}，残留 ${t.planned_blob_count} 个 / ${fmt(t.planned_total_bytes)}
  ${t.state==="planned"?`<button onclick="confirmTask(${t.id})">确认清理</button><button onclick="cancelTask(${t.id})">取消</button>`:""}</div>`).join("")}
function renderTask(t){cleanupBox.innerHTML=`<div>任务 #${t.id}：${t.state}，计划残留 ${t.planned_blob_count} 个实体 / ${fmt(t.planned_total_bytes)}
  ${t.state==="planned"?`<button onclick="confirmTask(${t.id})">确认清理</button><button onclick="cancelTask(${t.id})">取消</button>`:`已删除 ${t.deleted_blob_count} 个，释放 ${fmt(t.freed_bytes)}`}</div>`}
async function confirmTask(id){const {data}=await api(`/api/storage/cleanups/${id}/confirm`,{method:"POST"});storageOut.textContent=JSON.stringify(data,null,2);renderTask(data)}
async function cancelTask(id){const {data}=await api(`/api/storage/cleanups/${id}/cancel`,{method:"POST"});storageOut.textContent=JSON.stringify(data,null,2);renderTask(data)}
</script></body></html>
